<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 4 - Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./resources/css/style.css">
  </head>
  <body>

    <div class="row">
        <div class="col-12 col-md-2">
            <div class="custom-container">
                <button
                    class="btn btn-primary mt-3"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#event_modal"
                    >
                    Create Event
                </button>
            </div>
        </div>

        <div class="modal" id="event_modal">
            <div class="modal-dialog">

    
             <div class="modal-content">
                    <div class="modal-body">
                
                    <form class="needs-validation" id="event_form">
                         <div class="mb-3">
                            <label for="event_name" class="form-label">Event Name</label>
                            <input  class="form-control" type="text" id="event_name" id="event_name" required>
                            <div class="invalid-feedback">
                                Please choose a event name.
                            </div>
                         </div>
                        
                         <div class="mb-3">
                            <label for="event_weekday" class="form-label">Event day</label>
                            <select  class="form-control" id="event_weekday">
                                <option>Monday</option>
                                <option>Tuesday</option>
                                <option>Wednesday</option>
                                <option>Thursday</option>
                                <option>Friday</option>
                                <option>Saturday</option>
                                <option>Sunday</option>
                            </select>
                        </div>

                         <div class="mb-3">
                            <label for="event_time" class="form-label">Time</label>
                            <input  class="form-control" type="time" id="event_time" required>
                            <div class="invalid-feedback">
                                Please choose a time.
                            </div>
                        </div>

                         <div class="mb-3">
                            <label for="event_modality" class="form-label">Modality</label>
                            <select class="form-control" id="event_modality" required onchange="updateLocationOptions(this.value)">
                                <option>in-person</option>
                                <option>remote</option>
                            </select>
                        </div>

                        <div class="mb-3" id="inPerson_event_container">
                            <label for="event_location" class="form-label">Location</label>
                            <input  class="form-control" type="text" id="event_location" required>

                            <div class="invalid-feedback">
                                Please choose a location.
                            </div>
                        </div>

                        <div class="mb-3" id="remote_event_container">
                            <label for="event_name" class="event_remote_url">Remote URL</label>
                            <input  class="form-control" type="url" id="event_remote_url" pattern="https?://[a-zA-Z0-9\/\.]+" placeholder="URL for remote meeting" required>

                             <div class="invalid-feedback">
                               invalid URL structure.
                            </div>
                        </div>

                         <div class="mb-3">
                            <label for="event_name" class="Attendees">Attendees</label>
                            <input  class="form-control" type="text" id="event_attendees" required>

                            <div class="invalid-feedback">
                                Please add attendees.
                            </div>
                        </div>

                        <div class="mb-3">
                           <label for="catagory" class="form-label">Event Catagory</label>
                            <select  class="form-control" id="catagory">
                                <option>School</option>
                                <option>Work</option>
                                <option>Social</option>
                            </select>                        
                        </div>

                        <button class="btn btn-primary" type="button" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-primary" type="button" onclick="saveEvent()">Save</button>
                    </form>
                </div>
            </div>
            </div>
        </div>


        <div class="col-12 col-md-10">
            <div class="container-md container-fluid py-4 h-100">
                <div id="calendar" class="row h-100">
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
                        <div class="h6 text-center position-relative py-2 day">
                            Sunday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
                        <div class="h6 text-center position-relative py-2 day">
                            Monday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Tuesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Wednesday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
                        <div class="h6 text-center position-relative py-2 day">
                            Thursday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
                        <div class="h6 text-center position-relative py-2 day">
                            Friday
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
                        <div class="h6 text-center position-relative py-2 day">
                            Saturday
                        </div>
                    </div>
                </div>        
            </div>
        </div>
    </div>

    <script src="./resources/js/script.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
